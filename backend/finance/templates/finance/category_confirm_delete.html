{% extends "finance/base.html" %}

{% block title %}Excluir categoria{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold mb-4">Excluir categoria</h1>
<p class="mb-4">Tem certeza que deseja excluir <strong>{{ object.name }}</strong>? (soft delete — pode ser restaurada depois pelo admin)</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Confirmar exclusão</button>
    <a href="{% url 'finance:category_list' %}" class="ml-3 text-gray-600 hover:underline">Cancelar</a>
</form>
{% endblock %}
